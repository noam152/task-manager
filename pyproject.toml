[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.coverage.run]
branch = true
source = ["task_manager", "app"]
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
